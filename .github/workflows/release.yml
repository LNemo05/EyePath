name: Release

# Push a tag like v0.1.0, or run manually with a tag input.
# Builds a release APK, renames it, and publishes a GitHub Release asset.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Resolve version from tag
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "Tag must start with v (got: $TAG)"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "apk_name=EyePath-${VERSION}.apk"
            echo "release_name=EyePath ${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "Release tag=$TAG version=$VERSION"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Stage named APK
        shell: bash
        run: |
          mkdir -p dist
          SRC="app/build/outputs/apk/release/app-release.apk"
          test -f "$SRC"
          cp "$SRC" "dist/${{ steps.ver.outputs.apk_name }}"
          ls -la dist/

      # workflow_dispatch can create the tag on the default branch tip if it does not exist yet
      - name: Ensure tag exists (manual runs)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Create GitHub Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.release_name }}
          generate_release_notes: true
          files: dist/${{ steps.ver.outputs.apk_name }}
          fail_on_unmatched_files: true
          body: |
            ## EyePath ${{ steps.ver.outputs.version }}

            Download **`${{ steps.ver.outputs.apk_name }}`** below and install on Android 10+.

            After install, open **Permissions** and grant Accessibility (and other modes as needed).

            > Built by CI. MVP release builds may use the debug signing config until a production keystore is configured.
